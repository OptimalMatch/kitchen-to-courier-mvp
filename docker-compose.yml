# Kitchen to courier, the MVP on one machine. One container per design
# node; a node that joins two libraries runs two engine processes (see
# DECISIONS.md). Libraries: chain-ops (the chain's own), platform-eu (the
# platform's own), chain-platform-shared (where the two companies meet).
#
# Ports inside every container: first library 47800/47801 (sync/DHT),
# API 7480; second library 47810/47811, API 7481. Host ports below (17480 and up, clear of any node already on the machine).
x-node: &node
  build:
    context: .
    args: { UNIDATUM_VERSION: "${UNIDATUM_VERSION}" }
  image: unidatum:${UNIDATUM_VERSION}
  networks: [demo]
  restart: unless-stopped

services:
  # The chain: three restaurants and its head office, on chain-ops and the shared library.
  restaurant-1:
    <<: *node
    environment:
      NODE_NAME: restaurant-1
      LIBRARIES: "chain-ops:47800:47801:7480;chain-platform-shared:47810:47811:7481"
      BOOTSTRAP: "chain-platform-shared=hub-1:47811"
      PEERS: "chain-platform-shared=hub-1:47810"
    volumes: ["restaurant-1-data:/data"]
    ports: ["17480:7480", "17481:7481"]
  restaurant-2:
    <<: *node
    environment:
      NODE_NAME: restaurant-2
      LIBRARIES: "chain-ops:47800:47801:7480;chain-platform-shared:47810:47811:7481"
      BOOTSTRAP: "chain-ops=restaurant-1:47801;chain-platform-shared=hub-1:47811"
      PEERS: "chain-ops=restaurant-1:47800;chain-platform-shared=hub-1:47810"
    volumes: ["restaurant-2-data:/data"]
    ports: ["17490:7480", "17491:7481"]
    depends_on: [restaurant-1]
  restaurant-3:
    <<: *node
    environment:
      NODE_NAME: restaurant-3
      LIBRARIES: "chain-ops:47800:47801:7480;chain-platform-shared:47810:47811:7481"
      BOOTSTRAP: "chain-ops=restaurant-1:47801;chain-platform-shared=hub-1:47811"
      PEERS: "chain-ops=restaurant-1:47800;chain-platform-shared=hub-1:47810"
    volumes: ["restaurant-3-data:/data"]
    ports: ["17500:7480", "17501:7481"]
    depends_on: [restaurant-1]
  head-office:
    <<: *node
    environment:
      NODE_NAME: head-office
      LIBRARIES: "chain-ops:47800:47801:7480;chain-platform-shared:47810:47811:7481"
      BOOTSTRAP: "chain-ops=restaurant-1:47801;chain-platform-shared=hub-1:47811"
      PEERS: "chain-ops=restaurant-1:47800;chain-platform-shared=hub-1:47810"
      PIPELINES: "chain-ops;chain-platform-shared"
      SQLD: "chain-ops:5433"
      SQLD_USER: "${SQLD_USER:-demo}"
      SQLD_PASSWORD: "${SQLD_PASSWORD}"
    volumes: ["head-office-data:/data"]
    ports: ["17510:7480", "17511:7481", "15434:5433"]
    depends_on: [restaurant-1]

  # The platform: two regional hubs and its analytics node, on platform-eu and the shared library.
  hub-1:
    <<: *node
    environment:
      NODE_NAME: hub-1
      LIBRARIES: "platform-eu:47800:47801:7480;chain-platform-shared:47810:47811:7481"
    volumes: ["hub-1-data:/data"]
    ports: ["17520:7480", "17521:7481"]
  hub-2:
    <<: *node
    environment:
      NODE_NAME: hub-2
      LIBRARIES: "platform-eu:47800:47801:7480;chain-platform-shared:47810:47811:7481"
      BOOTSTRAP: "platform-eu=hub-1:47801;chain-platform-shared=hub-1:47811"
      PEERS: "platform-eu=hub-1:47800;chain-platform-shared=hub-1:47810"
    volumes: ["hub-2-data:/data"]
    ports: ["17530:7480", "17531:7481"]
    depends_on: [hub-1]
  analytics:
    <<: *node
    environment:
      NODE_NAME: analytics
      LIBRARIES: "platform-eu:47800:47801:7480;chain-platform-shared:47810:47811:7481"
      BOOTSTRAP: "platform-eu=hub-1:47801;chain-platform-shared=hub-1:47811"
      PEERS: "platform-eu=hub-1:47800;chain-platform-shared=hub-1:47810"
      PIPELINES: "platform-eu;chain-platform-shared"
      SQLD: "platform-eu:5433"
      SQLD_USER: "${SQLD_USER:-demo}"
      SQLD_PASSWORD: "${SQLD_PASSWORD}"
    volumes: ["analytics-data:/data"]
    ports: ["17540:7480", "17541:7481", "15433:5433"]
    depends_on: [hub-1]

  # The tools: seed, register the pipelines, run the checks (docker compose run --rm tools node seed/seed.mjs).
  tools:
    image: node:22-alpine
    profiles: [tools]
    working_dir: /app
    volumes: ["./lib:/app/lib:ro", "./seed:/app/seed:ro", "./pipelines:/app/pipelines:ro", "./sims:/app/sims:ro", "./checks:/app/checks:ro", "./bin:/app/bin:ro"]
    networks: [demo]
    depends_on: [restaurant-1, hub-1, head-office, analytics]

  # The simulators: the apps of the design, each making the build sheet's calls (docker compose --profile sims up -d).
  kitchen-display-1: &sim
    image: node:22-alpine
    profiles: [sims]
    working_dir: /app
    volumes: ["./lib:/app/lib:ro", "./sims:/app/sims:ro"]
    networks: [demo]
    restart: unless-stopped
    environment: { RESTAURANT: r1 }
    command: node sims/kitchen-display.mjs
  kitchen-display-2:
    <<: *sim
    environment: { RESTAURANT: r2 }
  kitchen-display-3:
    <<: *sim
    environment: { RESTAURANT: r3 }
  dispatch-1:
    <<: *sim
    environment: { HUB: hub-1 }
    command: node sims/hub-dispatch.mjs
  dispatch-2:
    <<: *sim
    environment: { HUB: hub-2 }
    command: node sims/hub-dispatch.mjs
  courier-app-1:
    <<: *sim
    environment: { HUB: hub-1 }
    command: node sims/courier-app.mjs
  courier-app-2:
    <<: *sim
    environment: { HUB: hub-2 }
    command: node sims/courier-app.mjs

  # The dashboards: Metabase over the PostgreSQL wire of the analytics node and the head office.
  metabase:
    image: metabase/metabase:latest
    ports: ["13100:3000"]
    networks: [demo]
    depends_on: [analytics, head-office]
    volumes: ["metabase-data:/metabase.db"]

volumes:
  restaurant-1-data: {}
  restaurant-2-data: {}
  restaurant-3-data: {}
  head-office-data: {}
  hub-1-data: {}
  hub-2-data: {}
  analytics-data: {}
  metabase-data: {}

networks:
  demo: {}
